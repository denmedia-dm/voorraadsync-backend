{% extends "base.html" %}
{% block content %}

<style>
.page {
    max-width: 1200px;
    margin: 20px auto;
    padding: 10px;
}

/* ---------- CARDS ---------- */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
}
.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}
.card-title {
    font-size: 14px;
    color: #6b7280;
}
.card-value {
    font-size: 26px;
    font-weight: 700;
}

/* ---------- TOOLBAR ---------- */
.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
}
.search-box input {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    flex: 1;
}
.btn-sync {
    padding: 12px 20px;
    border-radius: 999px;
    color: white;
    font-weight: 600;
    background: #059669;
    border: none;
    cursor: pointer;
}
.btn-blue { background: #2563eb; }

/* ---------- TABLE (DESKTOP) ---------- */
.table-container { width:100%; overflow-x:auto; }
table {
    width:100%;
    min-width:900px;
    background:white;
    border-radius:12px;
    box-shadow:0 4px 18px rgba(0,0,0,0.06);
    border-collapse:collapse;
}
th, td {
    padding:12px 10px;
    border-bottom:1px solid #e5e7eb;
}
.low-stock { color:#b91c1c; font-weight:bold; }
input[type=number] {
    width:70px; padding:7px;
    border-radius:8px;
    border:1px solid #d1d5db;
}
.btn-save {
    padding:6px 12px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:8px;
}

/* ---------- MOBILE ---------- */
@media (max-width:768px) {
    .table-container { display:none; }
    .mobile-list { display:block; }

    .mobile-card {
        background:white;
        padding:14px;
        border-radius:14px;
        margin-bottom:12px;
        box-shadow:0 2px 12px rgba(0,0,0,0.06);
    }
    .mobile-title { font-size:16px; font-weight:700; }
    .mobile-sku { font-size:13px; color:#6b7280; }
    .mobile-detail { display:none; margin-top:12px; }
    .detail-row {
        display:flex;
        justify-content:space-between;
        margin-bottom:8px;
    }
    .mobile-save {
        width:100%;
        padding:10px;
        background:#4f46e5;
        color:white;
        border:none;
        border-radius:8px;
        font-weight:600;
    }
}
@media (min-width:769px) {
    .mobile-list { display:none; }
}
</style>

<div class="page">

<!-- ================= STATS ================= -->
<div class="cards">
  <div class="card">
    <div class="card-title">Toplam ürün</div>
    <div class="card-value" id="stat-total">...</div>
  </div>

  <div class="card">
    <div class="card-title">Düşük stok (&lt; 5)</div>
    <div class="card-value" id="stat-low">...</div>
  </div>

  <div class="card">
    <div class="card-title">Son senkron</div>
    <div class="card-value" id="stat-sync" style="font-size:18px;">Yükleniyor…</div>
  </div>
</div>

<!-- ================= TOOLBAR ================= -->
<div class="toolbar">
    <div class="search-box">
        <input id="searchInput" placeholder="Ürün adı veya SKU ara..." onkeyup="filterResults()">
    </div>
    <button class="btn-sync" onclick="syncNow()">🔄 SYNC</button>
    <a href="/export/csv" class="btn-sync btn-blue">📥 CSV</a>
</div>

<!-- ================= DESKTOP TABLE ================= -->
<div class="table-container">
<table>
<thead>
<tr>
  <th>ID</th><th>Ürün</th><th>SKU</th>
  <th>Stok</th><th>Fiyat</th><th>Durum</th><th>Stok G.</th>
</tr>
</thead>
<tbody id="product-table"></tbody>
</table>
</div>

<!-- ================= MOBILE LIST ================= -->
<div class="mobile-list" id="mobile-list"></div>

<!-- ================= PAGINATION ================= -->
<div style="display:flex;justify-content:center;gap:10px;margin-top:20px;">
    <button onclick="prevPage()">⬅</button>
    <strong id="page-info">1 / 1</strong>
    <button onclick="nextPage()">➡</button>
</div>

</div>

<script>
/* ===== DASHBOARD STATS (LAZY LOAD) ===== */
document.addEventListener("DOMContentLoaded", () => {
  fetch("/api/dashboard/stats?threshold=5")
    .then(r => r.json())
    .then(d => {
      if(d.error) return;
      document.getElementById("stat-total").innerText = d.total_products ?? "-";
      document.getElementById("stat-low").innerText = d.low_stock ?? "0";
      document.getElementById("stat-sync").innerText = d.last_sync ?? "-";
    });
});

/* ===== PRODUCTS ===== */
let currentPage=1, totalPages=1, currentItems=[];

function loadPage(page){
fetch(`/woo/products/page/${page}`).then(r=>r.json()).then(d=>{
currentPage=d.page; totalPages=d.total_pages; currentItems=d.items;
document.getElementById("page-info").innerText=`${currentPage} / ${totalPages}`;
drawDesktop(); drawMobile();
});
}

function drawDesktop(){
const t=document.getElementById("product-table"); t.innerHTML="";
currentItems.forEach(p=>{
t.innerHTML+=`
<tr>
<td>${p.id}</td>
<td>${p.name}</td>
<td>${p.sku??"-"}</td>
<td class="${(p.stock_quantity??9999)<5?'low-stock':''}">
${p.stock_quantity??"-"}
</td>
<td>${p.regular_price??"-"}</td>
<td>${p.status}</td>
<td>
<input id="qty-${p.id}" type="number" value="${p.stock_quantity??0}">
<button class="btn-save" onclick="updateStock(${p.id})">Kaydet</button>
</td>
</tr>`;
});
}

function drawMobile(){
const m=document.getElementById("mobile-list"); m.innerHTML="";
currentItems.forEach(p=>{
m.innerHTML+=`
<div class="mobile-card" onclick="toggle(${p.id})">
<div class="mobile-title">${p.name}</div>
<div class="mobile-sku">${p.sku??"-"}</div>
<div class="mobile-detail" id="m-${p.id}">
<div class="detail-row">
<span>Stok</span>
<input id="mqty-${p.id}" type="number" value="${p.stock_quantity??0}">
</div>
<button class="mobile-save"
onclick="event.stopPropagation();updateStock(${p.id})">
Kaydet
</button>
</div></div>`;
});
}

function toggle(id){
let e=document.getElementById("m-"+id);
e.style.display=e.style.display==="block"?"none":"block";
}

function updateStock(id){
let q=document.getElementById("qty-"+id)?.value
?? document.getElementById("mqty-"+id).value;
fetch(`/woo/update_stock/${id}/${q}`).then(()=>loadPage(currentPage));
}

function filterResults(){
let s=document.getElementById("searchInput").value.toLowerCase();
document.querySelectorAll("#product-table tr").forEach(r=>{
r.style.display=r.innerText.toLowerCase().includes(s)?"":"none";
});
document.querySelectorAll(".mobile-card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(s)?"":"none";
});
}

function nextPage(){ if(currentPage<totalPages) loadPage(currentPage+1); }
function prevPage(){ if(currentPage>1) loadPage(currentPage-1); }
function syncNow(){ fetch("/sync").then(()=>alert("Senkronlandı")); }

loadPage(1);
</script>

{% endblock %}
